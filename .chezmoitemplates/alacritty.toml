# https://alacritty.org/config-alacritty.html

[general]
working_directory = "{{ .chezmoi.homeDir | replace "\\" "/" }}"
import = ["themes/carbonfox.toml"]

[window]
dimensions = { columns = 115, lines = 30 }
position = "None"
startup_mode = "Windowed"
decorations = "Full"
opacity = 1.0
padding = { x = 20, y = 0 }
dynamic_padding = true
title = ""
dynamic_title = false

[scrolling]
history = 5000

[font]
normal = { family = "CodeNewRoman Nerd Font", style = "Regular" }
bold = { family = "CodeNewRoman Nerd Font", style = "Bold" }
italic = { family = "CodeNewRoman Nerd Font", style = "Italic" }
size = 15.0
offset.x = 0
offset.y = 3

[cursor]
style = { shape = "Beam", blinking = "On" }

[terminal]
{{- if eq .chezmoi.os "windows" }}
shell = { program = "pwsh.exe", args = ["-NoLogo"] }
{{- else }}
shell = { program = "zsh", args = ["-l"] }
{{- end }}

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
