# Focused btop layouts launched from the Waybar resource indicators.
# Preset 1: CPU, preset 2: memory and processes, preset 3: NVIDIA GPU.
presets = "cpu:0:default mem:0:default,proc:0:default gpu0:0:default"

# Keep this launcher-specific file deterministic; the normal btop configuration
# remains free for interactive experimentation.
save_config_on_exit = false
show_gpu_info = "Off"
shown_gpus = "nvidia"

