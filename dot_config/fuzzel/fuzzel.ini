[main]
# Colors are generated by the native Omarchy theme engine. Keeping them in an
# included runtime file lets theme changes remain interactive without making
# fuzzel.ini mutable or creating chezmoi conflicts.
include=~/.local/state/omarchy/current/theme/fuzzel.ini
include=~/.local/state/desktop-core/fuzzel-font-size.ini
# Settings below the includes win. For example, adding `font=Family:size=13`
# here opts Fuzzel out of the interactive desktop text-size default.
font=JetBrains Mono:size=13
terminal=ghostty -e
prompt="> "
placeholder=""
icon-theme=Adwaita
icons-enabled=yes
lines=12
width=38
horizontal-pad=24
vertical-pad=14
inner-pad=8
layer=overlay
list-executables-in-path=no

[border]
width=2
radius=10
