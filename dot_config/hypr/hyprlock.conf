general {
    hide_cursor = true
    # Finish the first frame before loading less important resources. This is
    # especially useful when the lock is created immediately before suspend.
    immediate_render = true
    grace = 0
}

background {
    monitor =
    color = rgba(11111bff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(a6adc8ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password…</span>
    fail_text = <span foreground="##f38ba8">Authentication failed</span>
    rounding = 10
    position = 0, -45
    halign = center
    valign = center
}
