[dmenu]
dmenu_command = fuzzel --minimal-lines --width=48 --lines=12
active_chars = 󰄬
highlight = False
compact = False
pinentry = pinentry-gnome3
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name:<{max_len_name}s}  {sec}
list_saved = False
prompt = Wi-Fi

[dmenu_passphrase]
obscure = True

[pinentry]
description = Enter the Wi-Fi password
prompt = Password:

[editor]
terminal = ghostty
gui_if_available = True
gui = env GTK_THEME=Adwaita:dark nm-connection-editor

[nmdm]
rescan_delay = 3
notification_timeout = 4
show_notifications = True

