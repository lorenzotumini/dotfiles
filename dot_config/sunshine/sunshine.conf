# Stream the active Hyprland output through the compositor-native wlroots
# capture path and use the NVIDIA hardware encoder. Sunshine keeps pairing,
# credentials, certificates, and client state in its separate state file.
sunshine_name = desktop
capture = wlr
encoder = nvenc
nvenc_preset = 1

# Remote access is provided only through this desktop's Tailscale address.
# Never ask the router to expose Sunshine directly.
upnp = disabled
bind_address = 100.107.6.2
# Sunshine classifies Tailscale's CGNAT range as WAN. This remains safe because
# every Sunshine socket is bound exclusively to the tailnet address above.
origin_web_ui_allowed = wan
csrf_allowed_origins = https://100.107.6.2:47990
